<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan Trip - Travel Explorer</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                🌐 Travel Explorer
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link" href="index.html">
                            Home
                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link" href="destinations.html">
                            Destinations
                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link active" href="plan.html">
                            Plan Trip
                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ================= PLAN TRIP ================= -->

    <main class="container py-5">

        <div class="text-center mb-5">

            <h1>
                Plan Your Trip
            </h1>

            <p>
                Enter your travel information below.
            </p>

        </div>


        <!-- Travel Planning Form -->

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h2 class="card-title mb-4">
                            Travel Planning
                        </h2>


                        <form>


                            <!-- Destination -->

                            <div class="mb-3">

                                <label for="destination" class="form-label">
                                    Where do you want to go?
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="destination"
                                    placeholder="Enter a destination">

                            </div>


                            <!-- Start Date -->

                            <div class="mb-3">

                                <label for="startDate" class="form-label">
                                    Start Date
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="startDate">

                            </div>


                            <!-- End Date -->

                            <div class="mb-3">

                                <label for="endDate" class="form-label">
                                    End Date
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="endDate">

                            </div>


                            <!-- Number of Travelers -->

                            <div class="mb-3">

                                <label for="travelers" class="form-label">
                                    Number of Travelers
                                </label>

                                <select
                                    class="form-select"
                                    id="travelers">

                                    <option selected>
                                        Choose number of travelers
                                    </option>

                                    <option value="1">
                                        1
                                    </option>

                                    <option value="2">
                                        2
                                    </option>

                                    <option value="3">
                                        3
                                    </option>

                                    <option value="4">
                                        4
                                    </option>

                                    <option value="5">
                                        5+
                                    </option>

                                </select>

                            </div>


                            <!-- Travel Style -->

                            <div class="mb-3">

                                <label for="travelStyle" class="form-label">
                                    What type of trip do you want?
                                </label>

                                <select
                                    class="form-select"
                                    id="travelStyle">

                                    <option selected>
                                        Choose a trip type
                                    </option>

                                    <option>
                                        Adventure
                                    </option>

                                    <option>
                                        Relaxation
                                    </option>

                                    <option>
                                        Family
                                    </option>

                                    <option>
                                        Culture
                                    </option>

                                    <option>
                                        Food
                                    </option>

                                </select>

                            </div>


                            <!-- Additional Information -->

                            <div class="mb-3">

                                <label for="message" class="form-label">
                                    Tell us more about your trip
                                </label>

                                <textarea
                                    class="form-control"
                                    id="message"
                                    rows="4"
                                    placeholder="What would you like to do?"></textarea>

                            </div>


                            <!-- Submit -->

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Plan My Trip

                            </button>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white text-center p-3">

        <small>
            © 2026 Travel Explorer | Built for AI-Integrated Applications
        </small>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
